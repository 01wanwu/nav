name: docker-publish

# 推送版本 tag（如 v0.7.1）时自动构建并发布镜像到 GHCR；
# 也可在 Actions 页面手动触发。
# 无需配置任何 secrets：使用内置 GITHUB_TOKEN 推送 ghcr.io。
#
# 多架构构建拆分：amd64 与 arm64 各自跑在原生 runner 上（GitHub 公开仓库
# 免费提供 ubuntu-24.04-arm），按 digest 推送后合并 manifest。QEMU 跨架构
# 模拟 npm ci / next build 极慢且不稳（Illegal instruction 崩溃），不再使用。
#
# 发版流程：npm version patch|minor|major（自动改 package.json 并打 tag）
# 后 git push --follow-tags；verify job 会强制 tag 与 package.json 版本一致。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 同一 ref 串行发布，避免并行构建争抢 GHA 缓存与 latest 标签
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # 先跑类型检查与测试，避免把坏版本推成镜像
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 Dockerfile 运行时镜像（node:20-alpine）保持同主版本
          node-version: 20
          cache: npm

      # tag 触发时强制 tag 与 package.json 版本一致，避免镜像标签与 /api/status 返回值不一致
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} 与 package.json 版本 ${pkg} 不一致。请改用 npm version ${tag} 更新版本后再推 tag。"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # GHCR 镜像名不允许大写，统一转小写（owner/Repo → owner/repo）
      - name: 计算镜像名
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag v0.7.1 → 0.7.1 / 0.7 / latest 三个标签（在 merge job 里统一打）
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # 按架构各推一个镜像层（无 tag，由 digest 标识），标签在 merge 阶段合并
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: 导出 digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载各架构 digest
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: 计算镜像名
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # 纯 registry 元数据操作：把 build job 已推上来的两个架构 digest
      # 组装成多架构 manifest 并打标签。不要在这里用 build-push-action——
      # 那会触发一次重新构建（无 context 时更会直接失败）。
      - name: 创建并推送多架构 manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)
