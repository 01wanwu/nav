name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check i18n messages
        run: npm run check:i18n

      # 纯函数自测（书签解析 / workspace / domain-verify），不依赖数据库
      - name: Test
        run: npm run test

      - name: Type check
        run: npx tsc --noEmit

      # 构建期数据库供给：与 Dockerfile 构建段同口径（静态预渲染页面需要可查询的数据库），
      # 避免依赖「全站恰好没有静态路由」这一隐式条件。
      # 路径必须绝对：Prisma CLI 把相对 file: 路径按 schema 所在目录解析，
      # 而应用/seed 经 lib/db-config 按 SQLITE_PATH（cwd 基准）解析，两端基准不同会各写各的库
      - name: Prepare build database
        run: |
          npx prisma db push --schema prisma/schema.sqlite.prisma --accept-data-loss --skip-generate
          npx tsx prisma/seed.ts full
        env:
          SQLITE_URL: "file:${{ github.workspace }}/data/nav.db"
          SQLITE_PATH: "${{ github.workspace }}/data/nav.db"

      # SKIP_OPEN_NEXT_BUILD=1：CI 只验证 Next.js 构建，跳过 OpenNext 产物处理
      - name: Build
        run: npm run build
        env:
          SKIP_OPEN_NEXT_BUILD: "1"
          SQLITE_PATH: "${{ github.workspace }}/data/nav.db"
